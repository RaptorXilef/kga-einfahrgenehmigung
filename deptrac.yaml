# deptrac.yaml
# Strikte VSA Überwachung der Bounded Contexts für den Modular Monolith
parameters:
  paths:
    - src
  cache_file: .cache/deptrac/.deptrac.cache

  layers:
    - name: SharedKernel
      collectors:
        - type: directory
          value: src/SharedKernel/.*
    - name: Permit
      collectors:
        - type: directory
          value: src/Modules/Permit/.*
    - name: Finance
      collectors:
        - type: directory
          value: src/Modules/Finance/.*
    - name: Voucher
      collectors:
        - type: directory
          value: src/Modules/Voucher/.*
    - name: Identity
      collectors:
        - type: directory
          value: src/Modules/Identity/.*
    - name: System
      collectors:
        - type: directory
          value: src/Modules/System/.*
    - name: ApplicationFramework
      collectors:
        - type: directory
          value: src/Application/.*|src/Bootstrap/.*|src/Contracts/.*
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: /.*/
          must_not:
            - type: directory
              value: src/.*

  ruleset:
    # Die Domänen/Module dürfen den SharedKernel und das Framework (z.B. Interfaces) nutzen.
    Permit:
      - SharedKernel
      - ApplicationFramework
      - Vendor
      - Voucher # Erlaubt für asynchrone / CQRS Preisabfragen (CalculateVoucherDiscount)

    Finance:
      - SharedKernel
      - ApplicationFramework
      - Vendor
      - Permit # Erlaubt, da Finance bei Zahlungseingang das Permit-Modul triggert (MarkPermitAsPaid)

    Voucher:
      - SharedKernel
      - ApplicationFramework
      - Vendor

    Identity:
      - SharedKernel
      - ApplicationFramework
      - Vendor
      - Permit # Erlaubt, da Identity die History prüft bevor Magic-Links gesendet werden

    System:
      - SharedKernel
      - ApplicationFramework
      - Vendor
      # Das System-Modul orchestriert als Controller-Instanz alle anderen Module (Dashboard, Maintenance)
      - Permit
      - Finance
      - Voucher
      - Identity

    SharedKernel:
      - Vendor

    ApplicationFramework:
      - SharedKernel
      - Vendor
      - System # Der FrontendController loggt Exceptions via System-Services
      - Identity # Der FrontendController verifiziert Sessions via AuthMiddleware

# deptrac.yaml
# Strikte Überwachung unserer Bounded Contexts (Modular Monolith)
parameters:
  paths:
    - ./src
  layers:
    - name: Permit
      collectors:
        - type: directory
          value: src/Modules/Permit/.*
    - name: Finance
      collectors:
        - type: directory
          value: src/Modules/Finance/.*
    - name: Voucher
      collectors:
        - type: directory
          value: src/Modules/Voucher/.*
    - name: Identity
      collectors:
        - type: directory
          value: src/Modules/Identity/.*
    - name: System
      collectors:
        - type: directory
          value: src/Modules/System/.*
    - name: SharedKernel
      collectors:
        - type: directory
          value: src/SharedKernel/.*
    - name: Framework
      collectors:
        - type: directory
          value: src/Application/.*|src/Bootstrap/.*|src/Contracts/.*|src/Infrastructure/.*

  ruleset:
    # Die Domänen/Module dürfen den SharedKernel und das Framework (z.B. HTTP/DI) nutzen.
    Permit:
      - SharedKernel
      - Framework
      - Voucher # Erlaubt für asynchrone / CQRS Preisabfragen (CalculateVoucherDiscount)

    Finance:
      - SharedKernel
      - Framework
      - Permit # Erlaubt, da Finance bei Zahlungseingang das Permit-Modul triggert (MarkPermitAsPaid)

    Voucher:
      - SharedKernel
      - Framework

    Identity:
      - SharedKernel
      - Framework

    System:
      - SharedKernel
      - Framework
      # Das System-Modul (z.B. Cronjobs, Backups) aggregiert technisch alle Module
      - Permit
      - Finance
      - Voucher
      - Identity

    SharedKernel: ~

deptrac:
  paths:
    - src
  ignore_uncovered_internal_classes: true
  cache_file: .cache/deptrac/.deptrac.cache

  layers:
    # --- 1. SHARED KERNEL ---
    - name: SharedKernel
      collectors:
        - type: directory
          value: src/SharedKernel/.*

    # --- 2. SCHICHTEN INNERHALB DER MODULE ---
    - name: ModuleDomain
      collectors:
        - type: classNameRegex
          value: ^App\\Modules\\[^\\]+\\Domain\\.*

    - name: ModuleApplication
      collectors:
        - type: classNameRegex
          value: ^App\\Modules\\[^\\]+\\Application\\.*

    - name: ModulePresentation
      collectors:
        - type: classNameRegex
          value: ^App\\Modules\\[^\\]+\\Presentation\\.*

    - name: ModuleInfrastructure
      collectors:
        - type: classNameRegex
          value: ^App\\Modules\\[^\\]+\\Infrastructure\\.*

    # --- 3. MODUL-GRENZEN (Für KGA) ---
    - name: PermitModule
      collectors:
        - type: classNameRegex
          value: ^App\\Modules\\Permit\\.*

    - name: FinanceModule
      collectors:
        - type: classNameRegex
          value: ^App\\Modules\\Finance\\.*

    - name: VoucherModule
      collectors:
        - type: classNameRegex
          value: ^App\\Modules\\Voucher\\.*

    # --- 4. EXTERN ---
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: /.*/
          must_not:
            - type: directory
              value: src/.*

  ruleset:
    # --- LAYER-REGELN (Gilt innerhalb jedes Moduls) ---
    ModuleDomain:
      - SharedKernel
      - Vendor

    ModuleApplication:
      - ModuleDomain
      - SharedKernel
      - Vendor

    ModulePresentation:
      - ModuleApplication
      - ModuleDomain
      - SharedKernel
      - Vendor

    ModuleInfrastructure:
      - ModuleApplication
      - ModuleDomain
      - SharedKernel
      - Vendor

    SharedKernel:
      - Vendor

    # --- MODUL-GRENZEN REGELN ---
    # Quer-Zugriffe über Infrastruktur verboten!
    PermitModule:
      - SharedKernel
      - Vendor

    FinanceModule:
      - SharedKernel
      - Vendor

    VoucherModule:
      - SharedKernel
      - Vendor

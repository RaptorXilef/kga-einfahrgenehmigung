# deptrac.yaml
# Strikte VSA Überwachung der Bounded Contexts für den Modular Monolith
parameters:
  paths:
    - src
  cache_file: .cache/deptrac/.deptrac.cache

layers:
  - name: SharedKernel
    collectors:
      - type: directory
        value: src/SharedKernel/.*
  - name: Permit
    collectors:
      - type: directory
        value: src/Modules/Permit/.*
  - name: Finance
    collectors:
      - type: directory
        value: src/Modules/Finance/.*
  - name: Voucher
    collectors:
      - type: directory
        value: src/Modules/Voucher/.*
  - name: Identity
    collectors:
      - type: directory
        value: src/Modules/Identity/.*
  - name: System
    collectors:
      - type: directory
        value: src/Modules/System/.*
  - name: Application
    collectors:
      - type: directory
        value: src/Application/.*
  - name: Contracts
    collectors:
      - type: directory
        value: src/Contracts/.*
  - name: Bootstrap
    collectors:
      - type: directory
        value: src/Bootstrap/.*
  - name: Vendor
    collectors:
      - type: bool
        must:
          - type: classNameRegex
            value: /.*/
        must_not:
          - type: directory
            value: src/.*

ruleset:
  Permit:
    - SharedKernel
    - Contracts
    - Application
    - Vendor
    - Voucher

  Finance:
    - SharedKernel
    - Contracts
    - Application
    - Vendor
    - Permit

  Voucher:
    - SharedKernel
    - Contracts
    - Application
    - Vendor

  Identity:
    - SharedKernel
    - Contracts
    - Application
    - Vendor
    - Permit

  System:
    - SharedKernel
    - Contracts
    - Application
    - Vendor
    - Permit
    - Finance
    - Voucher
    - Identity

  SharedKernel:
    - Vendor

  Contracts:
    - SharedKernel
    - Vendor

  Application:
    - SharedKernel
    - Contracts
    - Vendor

  Bootstrap:
    - Application
    - Contracts
    - SharedKernel
    - Vendor
    - Permit
    - Finance
    - Voucher
    - Identity
    - System

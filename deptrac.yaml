# deptrac.yaml
# Finale, strikte VSA Überwachung der Bounded Contexts für den Modular Monolith
deptrac:
    paths:
        - src
    cache_file: .cache/deptrac/.deptrac.cache

    layers:
        - name: SharedKernel
          collectors:
              - type: directory
                value: src/SharedKernel/.*
        - name: Permit
          collectors:
              - type: directory
                value: src/Modules/Permit/.*
        - name: Finance
          collectors:
              - type: directory
                value: src/Modules/Finance/.*
        - name: Voucher
          collectors:
              - type: directory
                value: src/Modules/Voucher/.*
        - name: Identity
          collectors:
              - type: directory
                value: src/Modules/Identity/.*
        - name: System
          collectors:
              - type: directory
                value: src/Modules/System/.*
        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*
        - name: Contracts
          collectors:
              - type: directory
                value: src/Contracts/.*
        - name: Bootstrap
          collectors:
              - type: directory
                value: src/Bootstrap/.*
        - name: Vendor
          collectors:
              - type: bool
                must:
                    - type: classNameRegex
                      value: /.*/
                must_not:
                    - type: directory
                      value: src/.*

    ruleset:
        # ---------------------------------------------------------
        # DIE BOUNDED CONTEXTS (Module - 100% isoliert!)
        # ---------------------------------------------------------
        Permit:
            - SharedKernel
            - Contracts
            - Application
            - Vendor

        Finance:
            - SharedKernel
            - Contracts
            - Application
            - Vendor

        Voucher:
            - SharedKernel
            - Contracts
            - Application
            - Vendor

        Identity:
            - SharedKernel
            - Contracts
            - Application
            - Vendor

        System:
            - SharedKernel
            - Contracts
            - Application
            - Vendor
            # System baut das Dashboard zusammen und darf dafür lesend (!) auf andere Module zugreifen
            - Permit # Benötigt für Dashboard-Rendering
            - Finance # Benötigt für Dashboard-Rendering
            - Voucher # Benötigt für Dashboard-Rendering
            - Identity # Benötigt für Role/User-Bereinigung und Dashboard

        # ---------------------------------------------------------
        # GLOBALE SCHICHTEN
        # ---------------------------------------------------------
        SharedKernel:
            - Vendor
            - Contracts # Infrastruktur implementiert die globalen Contracts

        Contracts:
            - SharedKernel
            - Vendor

        # Das Rahmenwerk
        Application:
            - SharedKernel
            - Contracts
            - Vendor
            # STRIKTER SCHUTZ: Application darf KEIN Modul direkt kennen! Alles läuft dynamisch über DI/Routen-Reflection.

        Bootstrap:
            - Application
            - Contracts
            - SharedKernel
            - Vendor
            - Permit
            - Finance
            - Voucher
            - Identity
            - System
